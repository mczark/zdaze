<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Zdążę!</title>
<style>
:root{--bg:#0f172a;--card:#1e293b;--card2:#273449;--tx:#e2e8f0;--mut:#94a3b8;--acc:#38bdf8;--ok:#22c55e;--bad:#ef4444;--warn:#f59e0b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
body{padding:env(safe-area-inset-top) 0 calc(72px + env(safe-area-inset-bottom))}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 6px}
header h1{font-size:22px;margin:0}
.view{display:none;padding:8px 16px 24px}.view.on{display:block}
.card{background:var(--card);border-radius:16px;padding:14px;margin:10px 0}
.row{display:flex;gap:10px;align-items:center}.grow{flex:1;min-width:0}
.mut{color:var(--mut);font-size:14px}.big{font-size:44px;font-weight:700;font-variant-numeric:tabular-nums}
button{font:inherit;color:var(--tx);background:var(--card2);border:0;border-radius:12px;padding:10px 14px;cursor:pointer}
button.pri{background:var(--acc);color:#04263a;font-weight:600}button.ok{background:var(--ok);color:#052e12;font-weight:600}button.bad{background:var(--bad);color:#fff;font-weight:600}
button.ghost{background:transparent;color:var(--mut);padding:6px 8px}
button:disabled{opacity:.4}
input,select{font:inherit;color:var(--tx);background:var(--card2);border:1px solid #334155;border-radius:10px;padding:9px 10px;width:100%}
label{display:block;font-size:13px;color:var(--mut);margin:8px 0 4px}
h2{font-size:18px;margin:16px 0 4px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:#0b1222;border-top:1px solid #1e293b;padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav button{flex:1;background:none;border-radius:0;padding:10px 0 12px;color:var(--mut);font-size:12px;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button span{font-size:22px}nav button.on{color:var(--acc)}
.fab{position:fixed;right:18px;bottom:calc(86px + env(safe-area-inset-bottom));width:64px;height:64px;border-radius:50%;font-size:34px;background:var(--acc);color:#04263a;box-shadow:0 6px 20px #0008;z-index:4}
.task{display:flex;align-items:center;gap:12px}
.ss{width:68px;height:68px;border-radius:50%;flex:none;font-weight:700;font-size:15px;background:var(--ok);color:#052e12}
.ss.run{background:var(--bad);color:#fff;animation:pulse 1.2s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 8px #ef444433}}
.pill{display:inline-block;padding:2px 8px;border-radius:99px;background:var(--card2);font-size:12px;color:var(--mut);margin-right:4px}
.sheet{position:fixed;inset:0;background:#000a;display:none;align-items:flex-end;z-index:10}.sheet.on{display:flex}
.sheet>div{background:var(--card);width:100%;max-height:88vh;overflow:auto;border-radius:20px 20px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom))}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top));transform:translateX(-50%);background:#334155;padding:10px 16px;border-radius:12px;z-index:20;display:none;max-width:90%}
.listen{position:fixed;inset:0;background:#0f172af2;z-index:15;display:none;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;padding:20px}
.listen.on{display:flex}.mic{width:110px;height:110px;border-radius:50%;background:var(--bad);display:flex;align-items:center;justify-content:center;font-size:50px;animation:pulse 1s infinite}
.pitem{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid #334155}
.pitem:last-child{border:0}.time{font-variant-numeric:tabular-nums;font-weight:700;color:var(--acc);width:52px}
.pitem input{width:64px;padding:6px}
#pItems .pitem{flex-wrap:wrap;row-gap:4px}#pItems .pname{flex:1 1 calc(100% - 64px);font-weight:600;overflow-wrap:anywhere}#pItems .pitem input{margin-left:60px}
.days{display:grid;grid-template-columns:repeat(15,1fr);gap:4px;margin-top:8px}
.days i{aspect-ratio:1;border-radius:4px;background:#334155}.days i.ok{background:var(--ok)}.days i.bad{background:var(--bad)}
.stat{flex:1;text-align:center}.stat b{display:block;font-size:26px}
.ring{position:relative;width:240px;height:240px;margin:10px auto}.ring svg{transform:rotate(-90deg)}
.ring .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.wake{position:fixed;inset:0;background:var(--warn);color:#000;z-index:16;display:none;flex-direction:column;align-items:center;justify-content:center;font-size:28px;font-weight:700;gap:12px}
.wake.on{display:flex}
.voiceon{background:var(--bad)!important;color:#fff!important}
</style>
</head>
<body>
<header><h1 id="ttl">Zdążę!</h1><div class="row"><button class="ghost" id="voiceBtn" title="Sterowanie głosem">🎤</button><button class="ghost" onclick="openSettings()">⚙️</button></div></header>

<!-- START / HISTORIA -->
<section class="view on" id="v-home">
  <div class="card" id="nextCard"></div>
  <div class="card">
    <div class="row"><div class="stat"><b id="stPct">–</b><span class="mut">na czas (30 dni)</span></div><div class="stat"><b id="stStreak">0</b><span class="mut">seria</span></div><div class="stat"><b id="stN">0</b><span class="mut">wszystkich</span></div></div>
    <div class="mut" style="margin-top:12px">Ostatnie 30 dni</div>
    <div class="days" id="days"></div>
  </div>
  <div class="card"><div class="mut">Zapas względem terminu (min) – ostatnie 14</div><div id="chart"></div></div>
  <div class="card" id="histList"></div>
</section>

<!-- ZBIERANIE DANYCH -->
<section class="view" id="v-data">
  <p class="mut">Dotknij <b>+</b> i powiedz nazwę zadania. Duży przycisk przy zadaniu = start / stop pomiaru. Głosem: „nowe zadanie prysznic”, „start prysznic”, „stop”.</p>
  <div id="tasks"></div>
</section>

<!-- PLANOWANIE -->
<section class="view" id="v-plan">
  <div class="card">
    <div class="row"><div class="grow"><label>Muszę skończyć o</label><input type="time" id="pDeadline"></div><div class="grow"><label>Dnia</label><input type="date" id="pDate"></div></div>
  </div>
  <div class="card"><div id="pItems"></div>
    <div class="row" style="margin-top:10px"><select id="pAdd" class="grow"></select><button onclick="planAdd()">Dodaj</button></div>
  </div>
  <div class="card" id="pSummary"></div>
  <button class="pri" style="width:100%;padding:16px" onclick="armPlan()">⏰ Ustaw budzik</button>
  <div id="pAlarmOpts"></div>
</section>

<!-- PILNOWANIE -->
<section class="view" id="v-guard"><div id="guard"></div></section>

<button class="fab" id="fab" onclick="newTaskVoice()">+</button>

<nav>
  <button data-v="home" class="on"><span>🏠</span>Start</button>
  <button data-v="data"><span>⏱️</span>Pomiary</button>
  <button data-v="plan"><span>🗓️</span>Plan</button>
  <button data-v="guard"><span>🛡️</span>Pilnuj</button>
</nav>

<div class="sheet" id="sheet" onclick="if(event.target===this)closeSheet()"><div id="sheetBody"></div></div>
<div class="listen" id="listen"><div class="mic">🎤</div><div id="listenTxt" style="font-size:20px">Słucham…</div><div id="listenHeard" class="mut"></div><button onclick="cancelListen()">Anuluj / wpisz ręcznie</button></div>
<div class="wake" id="wake" onclick="stopRing()"><div style="font-size:70px">⏰</div>Pobudka!<div style="font-size:16px">Dotknij, aby wyciszyć</div></div>
<div class="toast" id="toast"></div>

<script>
'use strict';
/* ========== STAN ========== */
const LS='zdaze.v1';
const def={tasks:[],plan:{deadline:'07:45',date:'',items:[],armed:false,alarmAt:0},run:null,history:[],
  settings:{apiKey:'',estimate:'avg',buffer:10,learn:true,lang:'pl-PL'},running:null};
let S;try{S=Object.assign(structuredClone(def),JSON.parse(localStorage.getItem(LS)||'{}'))}catch(e){S=structuredClone(def)}
S.settings=Object.assign({},def.settings,S.settings);S.plan=Object.assign({},def.plan,S.plan);
const save=()=>{try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}};
const $=id=>document.getElementById(id);
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const fmtDur=s=>{s=Math.max(0,Math.round(s));const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return h?`${h}:${pad(m)}:${pad(x)}`:`${m}:${pad(x)}`};
const fmtMin=s=>{const m=Math.round(s/60);return m>=60?`${Math.floor(m/60)} h ${m%60} min`:`${m} min`};
const hhmm=ts=>{const d=new Date(ts);return pad(d.getHours())+':'+pad(d.getMinutes())};
const toast=(t,ms=2500)=>{const e=$('toast');e.textContent=t;e.style.display='block';clearTimeout(e._t);e._t=setTimeout(()=>e.style.display='none',ms)};

/* ========== MOST NATYWNY (Android) ========== */
const N=window.Native||null; // obecny w aplikacji Android
const nCb={tts:{},rec:null};
window.__ttsDone=id=>{const f=nCb.tts[id];delete nCb.tts[id];f&&f()};
window.__srPartial=t=>{nCb.rec&&nCb.rec.onresult&&nCb.rec.onresult(t,false)};
window.__srFinal=t=>{nCb.rec&&nCb.rec.onresult&&nCb.rec.onresult(t,true)};
window.__srEnd=err=>{const r=nCb.rec;nCb.rec=null;if(r){if(err&&r.onerror)r.onerror({error:err});r.onend&&r.onend()}};
window.__nativeAlarm=()=>{if(S.plan.armed&&!S.run)startRun(true)};
/* uniwersalny rozpoznawacz: {continuous,interim,onresult(text,final),onerror,onend} */
function makeRec(o){
  if(N){return{start(){if(nCb.rec){const p=nCb.rec;nCb.rec=null;p.onend&&p.onend()}nCb.rec=o;N.listen(S.settings.lang,!!o.interim)},abort(){if(nCb.rec===o){N.stopListening()}}}}
  const r=new SR();r.lang=S.settings.lang;r.continuous=!!o.continuous;r.interimResults=!!o.interim;
  r.onresult=e=>{if(o.continuous){const x=e.results[e.results.length-1];o.onresult(x[0].transcript,x.isFinal)}else{let t='',f=false;for(const x of e.results){t+=x[0].transcript;f=x.isFinal}o.onresult(t,f)}};
  r.onerror=e=>o.onerror&&o.onerror(e);r.onend=()=>o.onend&&o.onend();
  return{start(){r.start()},abort(){r.abort()}}}

/* ========== DŹWIĘK ========== */
let AC=null;
function audio(){if(!AC){AC=new (window.AudioContext||window.webkitAudioContext)()}if(AC.state==='suspended')AC.resume();return AC}
function tone(freq,dur,when=0,vol=.6,type='sine'){const a=audio(),o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.value=freq;
  const t=a.currentTime+when;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.01);g.gain.setValueAtTime(vol,t+dur-.03);g.gain.linearRampToValueAtTime(0,t+dur);
  o.connect(g).connect(a.destination);o.start(t);o.stop(t+dur+.02)}
const beep3=()=>{for(let i=0;i<3;i++)tone(1200,.12,i*.25,.7,'square')};
const beepLong=()=>{tone(880,1.6,0,1,'square');tone(440,1.6,0,.5,'square')};
let ringT=null;
function startRing(){$('wake').classList.add('on');let n=0;const f=()=>{for(let i=0;i<4;i++)tone(988,.15,i*.2,1,'square');if(++n>40)stopRing()};f();ringT=setInterval(f,1500)}
function stopRing(){clearInterval(ringT);ringT=null;$('wake').classList.remove('on');if(S.run&&!S.run.announced){S.run.announced=true;save();announce()}}

/* ========== MOWA ========== */
let voicePL=null;
function pickVoice(){const v=speechSynthesis.getVoices();voicePL=v.find(x=>x.lang&&x.lang.toLowerCase().startsWith('pl'))||null}
if('speechSynthesis' in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice}
function say(t){return new Promise(res=>{if(N){const id=uid();nCb.tts[id]=res;N.speak(t,id);setTimeout(res,10000);return}if(!('speechSynthesis' in window))return res();speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);
  u.lang=S.settings.lang;if(voicePL)u.voice=voicePL;u.volume=1;u.rate=1;u.onend=u.onerror=()=>res();speechSynthesis.speak(u);setTimeout(res,8000)})}
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;const HAS_SR=!!(N||SR);
let onceRec=null,onceRes=null;
function listenOnce(prompt){return new Promise(res=>{
  if(!HAS_SR){res(null);return}
  pauseCmd();$('listenTxt').textContent=prompt;$('listenHeard').textContent='';$('listen').classList.add('on');
  let fin='';onceRes=res;
  const r=makeRec({interim:true,onresult:(t,f)=>{$('listenHeard').textContent=t;if(f)fin=t},onerror:()=>{},
    onend:()=>{$('listen').classList.remove('on');onceRec=null;const f=onceRes;onceRes=null;resumeCmd();f&&f(fin.trim()||null)}});onceRec=r;
  try{r.start()}catch(e){$('listen').classList.remove('on');resumeCmd();res(null)}})}
function cancelListen(){const f=onceRes;onceRes=null;if(onceRec)try{onceRec.abort()}catch(e){};$('listen').classList.remove('on');f&&f(undefined)}

/* Ciągłe komendy głosowe */
let cmdOn=false,cmdRec=null,cmdPaused=false;
function toggleVoice(){if(!HAS_SR)return toast('Ta przeglądarka nie obsługuje rozpoznawania mowy (użyj Chrome).');cmdOn=!cmdOn;$('voiceBtn').classList.toggle('voiceon',cmdOn);cmdOn?startCmd():stopCmd();toast(cmdOn?'Sterowanie głosem włączone':'Sterowanie głosem wyłączone')}
function startCmd(){if(!cmdOn||cmdPaused||cmdRec)return;
  const r=makeRec({continuous:true,interim:false,onresult:(t,f)=>{if(f)handleCmd(t.trim().toLowerCase())},
    onerror:e=>{if(e.error==='not-allowed'){cmdOn=false;$('voiceBtn').classList.remove('voiceon');toast('Brak dostępu do mikrofonu')}},
    onend:()=>{if(cmdRec===r)cmdRec=null;if(cmdOn&&!cmdPaused)setTimeout(startCmd,N?150:300)}});cmdRec=r;try{r.start()}catch(e){cmdRec=null}}
function stopCmd(){if(cmdRec)try{cmdRec.abort()}catch(e){};cmdRec=null}
function pauseCmd(){cmdPaused=true;stopCmd()}function resumeCmd(){cmdPaused=false;setTimeout(startCmd,400)}
function findTask(q){q=q.trim();if(!q)return null;return S.tasks.find(t=>t.name.toLowerCase()===q)||S.tasks.find(t=>t.name.toLowerCase().includes(q)||q.includes(t.name.toLowerCase()))}
function handleCmd(t){
  let m;
  if(m=t.match(/^(nowe|dodaj) zadanie\s*(.*)$/)){const n=m[2].trim();if(n){addTask(n);toast('Dodano: '+n)}else newTaskVoice();return}
  if(m=t.match(/^(start|zacznij|rozpocznij|startuj)\s*(.*)$/)){const tk=findTask(m[2])||(m[2]?null:lastTask());if(tk){startTimer(tk.id);say('Start '+tk.name)}else toast('Nie znam zadania: '+m[2]);return}
  if(/^(stop|koniec|zakończ|gotowe|stój)/.test(t)){
    if(S.run){guardDone();return}
    if(S.running){const tk=S.tasks.find(x=>x.id===S.running.id);const sec=stopTimer();if(tk)say(`${tk.name}: ${spokenDur(sec)}`)}return}
  if(S.run&&S.run.asking){if(/\btak\b|zdąż/.test(t)&&!/nie/.test(t))finishRun(true);else if(/\bnie\b/.test(t))finishRun(false)}
}
const lastTask=()=>S.tasks.slice().sort((a,b)=>(b.used||0)-(a.used||0))[0];
function spokenDur(s){s=Math.round(s);const m=Math.floor(s/60),x=s%60;return (m?m+' min ':'')+(x?x+' s':'')||'0 s'}

/* ========== ZADANIA I POMIARY ========== */
function addTask(name){const t={id:uid(),name:name.charAt(0).toUpperCase()+name.slice(1),samples:[],maps:null,used:Date.now()};S.tasks.unshift(t);save();renderTasks();renderPlan();return t}
async function newTaskVoice(){
  audio();
  let name=HAS_SR?await listenOnce('Powiedz nazwę zadania'):null;
  if(name===undefined||name===null){openNameSheet();return}
  addTask(name);toast('Dodano: '+name);say('Dodano '+name)}
function openNameSheet(){sheet(`<h2>Nowe zadanie</h2><input id="nName" placeholder="np. Prysznic" autofocus><div class="row" style="margin-top:12px"><button class="grow" onclick="closeSheet()">Anuluj</button><button class="pri grow" onclick="const v=$('nName').value.trim();if(v){addTask(v);closeSheet()}">Dodaj</button></div>`);setTimeout(()=>$('nName')&&$('nName').focus(),100)}
function estimate(t){const a=t.samples.map(s=>s.sec).sort((x,y)=>x-y);if(!a.length)return 0;let v;
  switch(S.settings.estimate){case'median':v=a[Math.floor((a.length-1)/2)];break;case'p80':v=a[Math.min(a.length-1,Math.ceil(a.length*.8)-1)];break;case'max':v=a[a.length-1];break;default:v=a.reduce((x,y)=>x+y,0)/a.length}
  return Math.round(v*(1+S.settings.buffer/100))}
function startTimer(id){audio();if(S.running&&S.running.id===id)return;if(S.running)stopTimer();S.running={id,start:Date.now()};const t=S.tasks.find(x=>x.id===id);if(t)t.used=Date.now();save();renderTasks();beepShort()}
function stopTimer(){if(!S.running)return 0;const sec=(Date.now()-S.running.start)/1000;const t=S.tasks.find(x=>x.id===S.running.id);
  if(t&&sec>=3){t.samples.push({sec:Math.round(sec),ts:Date.now(),src:'timer'})}else if(sec<3)toast('Za krótki pomiar – pominięto');
  S.running=null;save();renderTasks();renderPlan();tone(660,.15);return sec}
const beepShort=()=>tone(990,.12);
function toggleTimer(id){S.running&&S.running.id===id?stopTimer():startTimer(id)}
function renderTasks(){
  const el=$('tasks');if(!S.tasks.length){el.innerHTML='<div class="card mut" style="text-align:center;padding:30px">Brak zadań. Dotknij <b>+</b> i powiedz np. „prysznic”.</div>';return}
  el.innerHTML=S.tasks.map(t=>{const run=S.running&&S.running.id===t.id;const e=estimate(t);
    return `<div class="card task"><button class="ss ${run?'run':''}" onclick="toggleTimer('${t.id}')">${run?'<span data-live>0:00</span><br>STOP':'START'}</button>
    <div class="grow" onclick="openTask('${t.id}')"><div style="font-weight:600">${esc(t.name)}</div>
    <div class="mut">${t.samples.length?`szac. ${fmtMin(e)} · ${t.samples.length} pomiar${t.samples.length===1?'':'ów'}`:'brak pomiarów'}</div>
    ${t.maps?`<span class="pill">🗺️ ${esc(t.maps.mode)}</span>`:''}</div><button class="ghost" onclick="openTask('${t.id}')">›</button></div>`}).join('')}

function openTask(id){const t=S.tasks.find(x=>x.id===id);if(!t)return;const m=t.maps||{origin:'',dest:'',mode:'DRIVE',day:'1',time:'07:30'};
  sheet(`<div class="row"><input id="tName" value="${esc(t.name)}" class="grow"><button onclick="renameVoice('${id}')">🎤</button></div>
  <h2>Pomiary</h2><div class="mut">Szacunek do planu: <b>${fmtMin(estimate(t))}</b> (metoda: ${S.settings.estimate}, zapas ${S.settings.buffer}%)</div>
  <div>${t.samples.slice().reverse().map((s,i)=>{const j=t.samples.length-1-i;return `<div class="pitem"><span class="grow">${fmtDur(s.sec)} <span class="pill">${s.src==='maps'?'🗺️ Maps':s.src==='manual'?'ręcznie':s.src==='guard'?'pilnowanie':'stoper'}</span></span><span class="mut">${new Date(s.ts).toLocaleDateString('pl')}</span><button class="ghost" onclick="delSample('${id}',${j})">✕</button></div>`}).join('')||'<p class="mut">Brak</p>'}</div>
  <div class="row"><input id="tManual" type="number" min="0" step="0.5" placeholder="min" class="grow"><button onclick="addManual('${id}')">Dodaj ręcznie</button></div>
  <h2>🗺️ Czas z Google Maps</h2><div class="mut">Średni czas przejazdu w wybrany dzień i porę (z 3 najbliższych takich dni).</div>
  <label>Skąd</label><input id="mO" value="${esc(m.origin)}" placeholder="adres początkowy">
  <label>Dokąd</label><input id="mD" value="${esc(m.dest)}" placeholder="adres docelowy">
  <div class="row"><div class="grow"><label>Środek transportu</label><select id="mM">${[['DRIVE','Samochód'],['TRANSIT','Komunikacja'],['WALK','Pieszo'],['BICYCLE','Rower'],['TWO_WHEELER','Skuter/motocykl']].map(([v,l])=>`<option value="${v}" ${m.mode===v?'selected':''}>${l}</option>`).join('')}</select></div></div>
  <div class="row"><div class="grow"><label>Dzień</label><select id="mDay">${['Niedziela','Poniedziałek','Wtorek','Środa','Czwartek','Piątek','Sobota'].map((d,i)=>`<option value="${i}" ${String(m.day)===String(i)?'selected':''}>${d}</option>`).join('')}</select></div><div class="grow"><label>Wyjazd o</label><input type="time" id="mT" value="${m.time}"></div></div>
  <div class="row" style="margin-top:10px"><button class="pri grow" onclick="mapsFetch('${id}')">Pobierz czas</button><button class="grow" onclick="mapsOpen()">Otwórz Maps</button></div>
  <div id="mOut" class="mut" style="margin-top:6px">${S.settings.apiKey?'':'Automatyczne pobieranie wymaga klucza Google API (⚙️). Bez klucza otwórz Maps i wpisz czas ręcznie powyżej.'}</div>
  <div class="row" style="margin-top:18px"><button class="bad" onclick="delTask('${id}')">Usuń zadanie</button><button class="pri grow" onclick="saveTask('${id}')">Zapisz</button></div>`)}
async function renameVoice(id){const n=await listenOnce('Powiedz nową nazwę');if(n){$('tName').value=n}}
function saveTask(id){const t=S.tasks.find(x=>x.id===id);t.name=$('tName').value.trim()||t.name;saveMapsCfg(t);save();closeSheet();renderTasks();renderPlan()}
function saveMapsCfg(t){const o=$('mO').value.trim(),d=$('mD').value.trim();t.maps=(o&&d)?{origin:o,dest:d,mode:$('mM').value,day:$('mDay').value,time:$('mT').value}:null}
function delSample(id,j){const t=S.tasks.find(x=>x.id===id);t.samples.splice(j,1);save();openTask(id);renderTasks()}
function addManual(id){const v=parseFloat($('tManual').value);if(!(v>0))return;const t=S.tasks.find(x=>x.id===id);t.samples.push({sec:Math.round(v*60),ts:Date.now(),src:'manual'});save();openTask(id);renderTasks()}
function delTask(id){if(!sheetConfirm('Usunąć zadanie?',()=>{S.tasks=S.tasks.filter(x=>x.id!==id);S.plan.items=S.plan.items.filter(i=>i.taskId!==id);if(S.running&&S.running.id===id)S.running=null;save();closeSheet();renderTasks();renderPlan()}))return}
function nextOcc(day,time,k){const [h,mi]=time.split(':').map(Number);const d=new Date();d.setHours(h,mi,0,0);let add=(Number(day)-d.getDay()+7)%7;if(add===0&&d<=new Date())add=7;d.setDate(d.getDate()+add+7*k);return d}
function mapsOpen(){const o=$('mO').value,d=$('mD').value;const tm={DRIVE:'driving',TRANSIT:'transit',WALK:'walking',BICYCLE:'bicycling',TWO_WHEELER:'driving'}[$('mM').value];
  const a=document.createElement('a');a.href=`https://www.google.com/maps/dir/?api=1&origin=${encodeURIComponent(o)}&destination=${encodeURIComponent(d)}&travelmode=${tm}`;if(N){N.openUrl(a.href);return}a.target='_blank';a.rel='noopener';a.click()}
async function mapsFetch(id){const t=S.tasks.find(x=>x.id===id);saveMapsCfg(t);save();const out=$('mOut');
  if(!t.maps)return out.textContent='Podaj adres początkowy i docelowy.';if(!S.settings.apiKey)return out.textContent='Brak klucza Google API – dodaj go w ⚙️ Ustawieniach.';
  out.textContent='Pobieram…';const res=[];
  for(let k=0;k<3;k++){const dep=nextOcc(t.maps.day,t.maps.time,k);const body={origin:{address:t.maps.origin},destination:{address:t.maps.dest},travelMode:t.maps.mode,departureTime:dep.toISOString(),languageCode:'pl',units:'METRIC'};
    if(t.maps.mode==='DRIVE'||t.maps.mode==='TWO_WHEELER')body.routingPreference='TRAFFIC_AWARE_OPTIMAL';
    try{const r=await fetch('https://routes.googleapis.com/directions/v2:computeRoutes',{method:'POST',headers:{'Content-Type':'application/json','X-Goog-Api-Key':S.settings.apiKey,'X-Goog-FieldMask':'routes.duration,routes.distanceMeters'},body:JSON.stringify(body)});
      const j=await r.json();if(j.error)throw new Error(j.error.message);if(!j.routes||!j.routes.length)throw new Error('Nie znaleziono trasy');res.push(parseInt(j.routes[0].duration))}
    catch(e){out.textContent='Błąd: '+e.message;return}}
  const avg=Math.round(res.reduce((a,b)=>a+b,0)/res.length);t.samples.push({sec:avg,ts:Date.now(),src:'maps'});save();renderTasks();renderPlan();
  openTask(id);$('mOut').textContent=`Średnio ${fmtMin(avg)} (pomiary: ${res.map(fmtMin).join(', ')}) – dodano jako pomiar.`}

/* ========== PLANOWANIE ========== */
function defaultDate(){const [h,m]=S.plan.deadline.split(':').map(Number);const d=new Date();d.setHours(h,m,0,0);const total=planTotal();if(d.getTime()-total*1000<Date.now())d.setDate(d.getDate()+1);return d.toISOString().slice(0,10)}
const planTotal=()=>S.plan.items.reduce((a,i)=>a+i.sec,0);
function deadlineTs(){const [y,mo,d]=(S.plan.date||defaultDate()).split('-').map(Number);const [h,m]=S.plan.deadline.split(':').map(Number);return new Date(y,mo-1,d,h,m,0,0).getTime()}
function schedule(){let t=deadlineTs()-planTotal()*1000;return S.plan.items.map(i=>{const s=t;t+=i.sec*1000;return{...i,start:s,end:t}})}
function planAdd(){const id=$('pAdd').value;const t=S.tasks.find(x=>x.id===id);if(!t)return;S.plan.items.push({taskId:id,sec:estimate(t)||300});save();renderPlan()}
function planMove(i,d){const a=S.plan.items,j=i+d;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];save();renderPlan()}
function planDel(i){S.plan.items.splice(i,1);save();renderPlan()}
function planSet(i,v){S.plan.items[i].sec=Math.max(0,Math.round(parseFloat(v||0)*60));save();renderPlan(true)}
function planRefresh(i){const it=S.plan.items[i];const t=S.tasks.find(x=>x.id===it.taskId);if(t&&estimate(t)){it.sec=estimate(t);save();renderPlan()}}
function renderPlan(keepFocus){
  $('pDeadline').value=S.plan.deadline;$('pDate').value=S.plan.date||defaultDate();
  $('pAdd').innerHTML=S.tasks.length?S.tasks.map(t=>`<option value="${t.id}">${esc(t.name)} (${t.samples.length?fmtMin(estimate(t)):'?'})</option>`).join(''):'<option value="">— najpierw dodaj zadania w Pomiarach —</option>';
  const sch=schedule();
  if(!keepFocus)$('pItems').innerHTML=sch.length?sch.map((it,i)=>{const t=S.tasks.find(x=>x.id===it.taskId);return `<div class="pitem"><span class="time" data-st="${i}">${hhmm(it.start)}</span><span class="pname">${esc(t?t.name:'?')}</span>
    <input type="number" min="0" step="0.5" value="${+(it.sec/60).toFixed(1)}" onchange="planSet(${i},this.value)" title="minuty"><span class="mut">min</span>
    <button class="ghost" onclick="planRefresh(${i})" title="Weź szacunek z pomiarów">↻</button><button class="ghost" onclick="planMove(${i},-1)">▲</button><button class="ghost" onclick="planMove(${i},1)">▼</button><button class="ghost" onclick="planDel(${i})">✕</button></div>`}).join('')
    :'<p class="mut">Dodaj zadania w kolejności wykonywania. Czasy wezmą się z pomiarów (możesz je zmienić).</p>';
  else sch.forEach((it,i)=>{const e=document.querySelector(`[data-st="${i}"]`);if(e)e.textContent=hhmm(it.start)});
  const st=sch.length?sch[0].start:deadlineTs();
  $('pSummary').innerHTML=`<div class="row"><div class="stat"><b>${hhmm(st)}</b><span class="mut">start / budzik</span></div><div class="stat"><b>${fmtMin(planTotal())}</b><span class="mut">łącznie</span></div><div class="stat"><b>${S.plan.deadline}</b><span class="mut">koniec</span></div></div>
  ${st<Date.now()&&sch.length?'<p style="color:var(--bad)">⚠️ Start wypada w przeszłości – zmień datę lub godzinę.</p>':''}
  ${S.plan.armed?`<p style="color:var(--ok);text-align:center">✅ Budzik ustawiony na ${new Date(S.plan.alarmAt).toLocaleString('pl',{weekday:'short',hour:'2-digit',minute:'2-digit'})}</p>`:''}`;
  renderHome()}
$('pDeadline').onchange=e=>{S.plan.deadline=e.target.value;S.plan.date='';save();renderPlan()};
$('pDate').onchange=e=>{S.plan.date=e.target.value;save();renderPlan()};

async function armPlan(){
  if(!S.plan.items.length)return toast('Dodaj najpierw zadania do planu');
  audio();const sch=schedule();const at=sch[0].start;if(at<Date.now())return toast('Godzina startu już minęła');
  S.plan.date=S.plan.date||defaultDate();S.plan.armed=true;S.plan.alarmAt=at;save();requestWake();
  if(N)N.setAlarm(at,'Zdążę! – '+(S.tasks.find(x=>x.id===sch[0].taskId)||{name:'start'}).name);
  if(!N)try{if('Notification' in window&&Notification.permission==='default')await Notification.requestPermission()}catch(e){}
  const d=new Date(at);
  $('pAlarmOpts').innerHTML=`<div class="card"><b>Budzik w aplikacji ustawiony na ${hhmm(at)}.</b>
   ${N?`<p class="mut">Aplikacja uruchomi się sama o tej godzinie – nawet gdy telefon jest zablokowany. Możesz dodatkowo ustawić budzik w zegarze:</p>
   <button style="width:100%;margin:4px 0" onclick="N.systemAlarm(${d.getHours()},${d.getMinutes()},'Zdążę! – start')">⏰ Dodaj też do aplikacji Zegar</button>`:`<p class="mut">Zostaw aplikację otwartą (ekran nie zgaśnie, telefon najlepiej na ładowarce). Dla pewności dodaj też budzik systemowy:</p>
   <a href="intent:#Intent;action=android.intent.action.SET_ALARM;i.android.intent.extra.alarm.HOUR=${d.getHours()};i.android.intent.extra.alarm.MINUTES=${d.getMinutes()};S.android.intent.extra.alarm.MESSAGE=${encodeURIComponent('Zdążę! – start')};B.android.intent.extra.alarm.SKIP_UI=false;end"><button style="width:100%;margin:4px 0">⏰ Budzik systemowy (Android)</button></a>
   <button style="width:100%;margin:4px 0" onclick="downloadIcs()">📅 Przypomnienie w kalendarzu (.ics)</button>`}
   <button class="ghost" style="width:100%" onclick="disarm()">Anuluj budzik</button></div>`;
  renderPlan();renderGuard();say(`Budzik ustawiony na ${d.getHours()}:${pad(d.getMinutes())}`)}
function disarm(){if(N)N.cancelAlarm();S.plan.armed=false;save();$('pAlarmOpts').innerHTML='';renderPlan();renderGuard();toast('Budzik anulowany')}
function downloadIcs(){const sch=schedule();const f=ts=>new Date(ts).toISOString().replace(/[-:]/g,'').replace(/\.\d+/,'');
  const ev=sch.map((it,i)=>{const t=S.tasks.find(x=>x.id===it.taskId);return `BEGIN:VEVENT\r\nUID:${uid()}@zdaze\r\nDTSTAMP:${f(Date.now())}\r\nDTSTART:${f(it.start)}\r\nDTEND:${f(it.end)}\r\nSUMMARY:${(t?t.name:'Zadanie').replace(/[,;]/g,' ')}\r\n${i===0?'BEGIN:VALARM\r\nACTION:AUDIO\r\nTRIGGER:PT0M\r\nEND:VALARM\r\nBEGIN:VALARM\r\nACTION:DISPLAY\r\nDESCRIPTION:Zdążę! Start\r\nTRIGGER:PT0M\r\nEND:VALARM\r\n':''}END:VEVENT`}).join('\r\n');
  const b=new Blob([`BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//Zdaze//PL\r\n${ev}\r\nEND:VCALENDAR`],{type:'text/calendar'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='zdaze-plan.ics';a.click()}

/* Wake lock */
let wl=null;async function requestWake(){if(N){N.keepAwake(true);return}try{if('wakeLock' in navigator&&!wl){wl=await navigator.wakeLock.request('screen');wl.addEventListener('release',()=>wl=null)}}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&(S.plan.armed||S.run))requestWake()});

/* ========== PILNOWANIE ========== */
function startRun(fromAlarm){
  const sch=schedule();if(!sch.length)return toast('Plan jest pusty');
  const now=Date.now();
  S.run={items:sch.map(i=>({taskId:i.taskId,sec:i.sec})),idx:0,taskStart:now,deadline:fromAlarm?deadlineTs():now+planTotal()*1000,warned:false,announced:!fromAlarm,asking:false,started:now};
  S.plan.armed=false;save();requestWake();go('guard');renderGuard();
  if(fromAlarm){startRing();if(!N)try{new Notification('Zdążę! – pobudka',{body:'Czas zacząć: '+curName()})}catch(e){}}else announce()}
const curName=()=>{const it=S.run&&S.run.items[S.run.idx];const t=it&&S.tasks.find(x=>x.id===it.taskId);return t?t.name:'zadanie'};
function announce(){if(!S.run)return;const it=S.run.items[S.run.idx];say(`Teraz: ${curName()}. Masz ${spokenDur(it.sec)}.`)}
function guardDone(){if(!S.run||S.run.asking)return;nextTask(true)}
function nextTask(manual){const r=S.run;const it=r.items[r.idx];const actual=(Date.now()-r.taskStart)/1000;
  if(manual&&S.settings.learn&&actual>5){const t=S.tasks.find(x=>x.id===it.taskId);if(t)t.samples.push({sec:Math.round(actual),ts:Date.now(),src:'guard'})}
  if(!manual)beepLong();else tone(660,.2);
  r.idx++;r.taskStart=Date.now();r.warned=false;save();
  if(r.idx>=r.items.length){askFinish();return}
  setTimeout(announce,manual?300:1800);renderGuard()}
function askFinish(){const r=S.run;r.asking=true;r.finished=Date.now();save();renderGuard();
  say('Wszystkie zadania zakończone. Czy zdążyłeś?').then(async()=>{if(!S.run||!S.run.asking)return;if(cmdOn)return;const a=await listenOnce('Czy zdążyłeś? Powiedz „tak” lub „nie”');
    if(a&&S.run&&S.run.asking){const t=a.toLowerCase();if(/\btak\b|zdąż/.test(t)&&!/\bnie\b/.test(t))finishRun(true);else if(/\bnie\b/.test(t))finishRun(false)}})}
function finishRun(ok){const r=S.run;if(!r)return;S.history.push({ts:r.started,deadline:r.deadline,finished:r.finished||Date.now(),ok,n:r.items.length});S.run=null;save();if(N)N.keepAwake(false);
  say(ok?'Brawo! Zapisane.':'Zapisane. Następnym razem się uda.');renderGuard();renderHome();renderTasks();setTimeout(()=>go('home'),1500)}
function abortRun(){sheetConfirm('Przerwać pilnowanie? (bez zapisu w historii)',()=>{S.run=null;save();closeSheet();renderGuard()})}

function renderGuard(){const el=$('guard');const r=S.run;
  if(!r){const sch=schedule();
    el.innerHTML=S.plan.armed?`<div class="card" style="text-align:center"><div class="mut">Budzik za</div><div class="big" data-alarm>–</div><div class="mut">o ${hhmm(S.plan.alarmAt)} · koniec ${S.plan.deadline}</div><p class="mut">Zostaw aplikację otwartą. Ekran pozostanie włączony.</p><button class="ghost" onclick="disarm()">Anuluj budzik</button></div>
      <button class="pri" style="width:100%;padding:14px" onclick="startRun(false)">▶ Zacznij teraz</button>`
      :`<div class="card" style="text-align:center"><p>Brak aktywnego budzika.</p><p class="mut">${sch.length?`Plan: ${sch.length} zadań, ${fmtMin(planTotal())}.`:'Ułóż najpierw plan.'}</p>
      <button class="pri" style="width:100%;padding:14px;margin-bottom:8px" onclick="go('plan')">🗓️ Do planu</button>${sch.length?'<button style="width:100%;padding:14px" onclick="startRun(false)">▶ Zacznij teraz (test)</button>':''}</div>`;return}
  if(r.asking){el.innerHTML=`<div class="card" style="text-align:center;padding:30px 14px"><div style="font-size:60px">🏁</div><h2>Czy zdążyłeś?</h2><p class="mut">Termin: ${hhmm(r.deadline)} · koniec zadań: ${hhmm(r.finished)}</p>
    <div class="row"><button class="ok grow" style="padding:18px;font-size:20px" onclick="finishRun(true)">Tak 👍</button><button class="bad grow" style="padding:18px;font-size:20px" onclick="finishRun(false)">Nie 👎</button></div></div>`;return}
  const it=r.items[r.idx];const nx=r.items[r.idx+1];const nt=nx&&S.tasks.find(x=>x.id===nx.taskId);
  el.innerHTML=`<div style="text-align:center"><div class="mut">Zadanie ${r.idx+1} z ${r.items.length}</div><h2 style="font-size:28px;margin:4px 0">${esc(curName())}</h2></div>
  <div class="ring"><svg width="240" height="240"><circle cx="120" cy="120" r="108" stroke="#273449" stroke-width="14" fill="none"/><circle id="arc" cx="120" cy="120" r="108" stroke="var(--acc)" stroke-width="14" fill="none" stroke-linecap="round" stroke-dasharray="678.6" stroke-dashoffset="0"/></svg>
  <div class="c"><div class="big" id="gLeft">–</div><div class="mut">z ${fmtDur(it.sec)}</div></div></div>
  <button class="ok" style="width:100%;padding:18px;font-size:20px" onclick="guardDone()">✓ Gotowe – następne</button>
  <div class="card"><div class="row"><div class="grow"><div class="mut">Następne</div><b>${nt?esc(nt.name):'— koniec —'}</b></div><div style="text-align:right"><div class="mut">Termin</div><b>${hhmm(r.deadline)}</b></div></div><div class="mut" id="gSlack" style="margin-top:6px"></div></div>
  <button class="ghost" style="width:100%" onclick="abortRun()">Przerwij</button>`;tick()}

/* ========== HISTORIA ========== */
function renderHome(){
  const H=S.history.slice().sort((a,b)=>a.ts-b.ts);const now=Date.now(),D=864e5;
  const last30=H.filter(h=>h.ts>now-30*D);$('stPct').textContent=last30.length?Math.round(100*last30.filter(h=>h.ok).length/last30.length)+'%':'–';
  let st=0;for(let i=H.length-1;i>=0&&H[i].ok;i--)st++;$('stStreak').textContent=st;$('stN').textContent=H.length;
  let days='';for(let k=29;k>=0;k--){const d=new Date(now-k*D);const key=d.toDateString();const hs=H.filter(h=>new Date(h.ts).toDateString()===key);
    const c=hs.length?(hs.every(h=>h.ok)?'ok':'bad'):'';days+=`<i class="${c}" title="${d.toLocaleDateString('pl')}"></i>`}$('days').innerHTML=days;
  // wykres zapasu
  const L=H.slice(-14);if(!L.length){$('chart').innerHTML='<p class="mut">Brak danych – pierwszy pilnowany poranek pojawi się tutaj.</p>'}
  else{const v=L.map(h=>Math.round((h.deadline-h.finished)/60000));const mx=Math.max(5,...v.map(Math.abs));const W=320,Hh=140,mid=Hh/2,bw=W/14;
    $('chart').innerHTML=`<svg viewBox="0 0 ${W} ${Hh+16}" width="100%"><line x1="0" x2="${W}" y1="${mid}" y2="${mid}" stroke="#475569"/>${v.map((x,i)=>{const h=Math.abs(x)/mx*(mid-14);const ok=L[i].ok;
      return `<rect x="${i*bw+3}" y="${x>=0?mid-h:mid}" width="${bw-6}" height="${Math.max(1,h)}" rx="3" fill="${ok?'#22c55e':'#ef4444'}"/><text x="${i*bw+bw/2}" y="${x>=0?mid-h-3:mid+h+11}" font-size="9" fill="#94a3b8" text-anchor="middle">${x}</text>`}).join('')}
      <text x="0" y="${Hh+12}" font-size="9" fill="#94a3b8">${new Date(L[0].ts).toLocaleDateString('pl')}</text><text x="${W}" y="${Hh+12}" font-size="9" fill="#94a3b8" text-anchor="end">${new Date(L[L.length-1].ts).toLocaleDateString('pl')}</text></svg>`}
  $('histList').innerHTML='<div class="mut">Historia</div>'+(H.slice(-10).reverse().map((h,i)=>`<div class="pitem"><span style="font-size:20px">${h.ok?'✅':'❌'}</span><span class="grow">${new Date(h.ts).toLocaleDateString('pl',{weekday:'short',day:'numeric',month:'short'})}</span><span class="mut">termin ${hhmm(h.deadline)} · koniec ${hhmm(h.finished)}</span><button class="ghost" onclick="delHist(${h.ts})">✕</button></div>`).join('')||'<p class="mut">Pusto</p>');
  const nc=$('nextCard');
  if(S.run)nc.innerHTML=`<b>🛡️ Pilnowanie w toku</b><div class="mut">${esc(curName())}</div><button class="pri" style="margin-top:8px" onclick="go('guard')">Pokaż</button>`;
  else if(S.plan.armed)nc.innerHTML=`<div class="mut">Następny budzik</div><div class="big">${hhmm(S.plan.alarmAt)}</div><div class="mut">${new Date(S.plan.alarmAt).toLocaleDateString('pl',{weekday:'long'})} · koniec o ${S.plan.deadline}</div>`;
  else nc.innerHTML=`<b>Jak zacząć?</b><ol class="mut" style="margin:6px 0 0;padding-left:20px"><li>⏱️ Pomiary – dodaj zadania i zmierz ich czas</li><li>🗓️ Plan – ułóż kolejność i godzinę końca</li><li>⏰ Ustaw budzik – resztą zajmie się 🛡️ Pilnowanie</li></ol>`}
function delHist(ts){sheetConfirm('Usunąć wpis z historii?',()=>{S.history=S.history.filter(h=>h.ts!==ts);save();closeSheet();renderHome()})}

/* ========== USTAWIENIA ========== */
function openSettings(){const s=S.settings;sheet(`<h2>Ustawienia</h2>
  <label>Szacowanie czasu zadania z pomiarów</label><select id="sE">${[['avg','Średnia'],['median','Mediana'],['p80','80. percentyl (bezpieczniej)'],['max','Najdłuższy pomiar']].map(([v,l])=>`<option value="${v}" ${s.estimate===v?'selected':''}>${l}</option>`).join('')}</select>
  <label>Dodatkowy zapas czasu: <b id="sBv">${s.buffer}</b>%</label><input type="range" id="sB" min="0" max="50" step="5" value="${s.buffer}" oninput="$('sBv').textContent=this.value">
  <label><input type="checkbox" id="sL" ${s.learn?'checked':''} style="width:auto"> Ucz się z trybu pilnowania (przycisk „Gotowe” zapisuje rzeczywisty czas)</label>
  <label>Klucz Google API (Routes API)</label><input id="sK" value="${esc(s.apiKey)}" placeholder="AIza…">
  <div class="mut">Klucz z console.cloud.google.com z włączonym „Routes API”. Przechowywany tylko na tym telefonie.</div>
  <div class="row" style="margin-top:12px"><button class="grow" onclick="testSound()">🔊 Test dźwięków</button><button class="grow" onclick="exportData()">📋 Kopia danych</button></div>
  <div class="row" style="margin-top:8px"><button class="grow" onclick="importData()">📥 Przywróć dane</button></div>
  <button class="pri" style="width:100%;margin-top:14px" onclick="saveSettings()">Zapisz</button>`)}
function saveSettings(){Object.assign(S.settings,{estimate:$('sE').value,buffer:+$('sB').value,learn:$('sL').checked,apiKey:$('sK').value.trim()});save();closeSheet();renderTasks();renderPlan()}
function testSound(){audio();beep3();setTimeout(beepLong,1200);setTimeout(()=>say('Teraz: prysznic. Masz 10 minut.'),3200)}
function exportData(){const t=JSON.stringify({tasks:S.tasks,history:S.history,plan:S.plan,settings:{...S.settings,apiKey:''}});
  sheet(`<h2>Kopia danych</h2><textarea id="exp" style="width:100%;height:200px;background:#273449;color:#e2e8f0;border-radius:10px">${esc(t)}</textarea><div class="row" style="margin-top:8px"><button class="pri grow" onclick="if(N){N.copy($('exp').value);toast('Skopiowano');return}navigator.clipboard.writeText($('exp').value).then(()=>toast('Skopiowano'),()=>{$('exp').select();toast('Zaznaczono – skopiuj ręcznie')})">Kopiuj</button><button class="grow" onclick="closeSheet()">Zamknij</button></div>`)}
function importData(){sheet(`<h2>Przywróć dane</h2><textarea id="imp" placeholder="wklej kopię" style="width:100%;height:200px;background:#273449;color:#e2e8f0;border-radius:10px"></textarea><button class="pri" style="width:100%;margin-top:8px" onclick="doImport()">Przywróć</button>`)}
function doImport(){try{const d=JSON.parse($('imp').value);['tasks','history','plan'].forEach(k=>{if(d[k])S[k]=d[k]});if(d.settings)Object.assign(S.settings,d.settings,{apiKey:S.settings.apiKey});save();closeSheet();renderAll();toast('Przywrócono')}catch(e){toast('Niepoprawne dane')}}

/* ========== UI ========== */
function sheet(h){$('sheetBody').innerHTML=h;$('sheet').classList.add('on')}
function closeSheet(){$('sheet').classList.remove('on')}
function sheetConfirm(msg,yes){window._yes=yes;sheet(`<h2>${esc(msg)}</h2><div class="row" style="margin-top:14px"><button class="grow" onclick="closeSheet()">Nie</button><button class="bad grow" onclick="_yes()">Tak</button></div>`);return true}
function go(v){document.querySelectorAll('.view').forEach(e=>e.classList.toggle('on',e.id==='v-'+v));document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));
  $('fab').style.display=v==='data'?'block':'none';$('ttl').textContent={home:'Zdążę!',data:'Pomiary',plan:'Plan',guard:'Pilnowanie'}[v];if(v==='guard')renderGuard();if(v==='plan')renderPlan();window.scrollTo(0,0)}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{audio();go(b.dataset.v)});
$('voiceBtn').onclick=()=>{audio();toggleVoice()};
function renderAll(){renderTasks();renderPlan();renderGuard();renderHome()}

/* ========== ZEGAR GŁÓWNY ========== */
function tick(){const now=Date.now();
  if(S.running){const e=document.querySelector('[data-live]');if(e)e.textContent=fmtDur((now-S.running.start)/1000)}
  if(S.plan.armed&&!S.run){const a=document.querySelector('[data-alarm]');if(a)a.textContent=fmtDur((S.plan.alarmAt-now)/1000);
    if(now>=S.plan.alarmAt){if(now-S.plan.alarmAt<3*3600e3)startRun(true);else{S.plan.armed=false;save();renderAll()}}}
  const r=S.run;if(r&&!r.asking){const it=r.items[r.idx];const el=(now-r.taskStart)/1000;const left=it.sec-el;
    const g=$('gLeft');if(g){g.textContent=left>=0?fmtDur(left):'-'+fmtDur(-left);g.style.color=left<=30?'var(--warn)':'';
      const arc=$('arc');if(arc){arc.style.strokeDashoffset=678.6*Math.min(1,el/Math.max(1,it.sec));arc.style.stroke=left<=30?'var(--warn)':'var(--acc)'}
      const rest=r.items.slice(r.idx+1).reduce((a,x)=>a+x.sec,0);const proj=now+Math.max(0,left)*1000+rest*1000;const sl=Math.round((r.deadline-proj)/60000);
      const gs=$('gSlack');if(gs)gs.innerHTML=sl>=0?`<span style="color:var(--ok)">Zapas: ${sl} min</span>`:`<span style="color:var(--bad)">Opóźnienie: ${-sl} min</span>`}
    if(!r.warned&&left<=30&&it.sec>35){r.warned=true;save();beep3()}
    if(left<=0)nextTask(false)}
}
setInterval(tick,250);

/* ========== START ========== */
renderAll();go(S.run?'guard':'home');
if(S.plan.armed||S.run)requestWake();
if(S.plan.armed){$('pAlarmOpts').innerHTML=`<div class="card mut">Budzik ustawiony na ${hhmm(S.plan.alarmAt)}. <button class="ghost" onclick="disarm()">Anuluj</button></div>`}
if(!N&&'serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
document.addEventListener('click',()=>audio(),{once:true});
</script>
</body>
